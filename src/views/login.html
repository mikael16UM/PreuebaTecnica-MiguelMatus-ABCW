<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Administración · Iniciar sesión</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <main class="page page--narrow">
      <header class="page-header">
        <h1>Iniciar sesión</h1>
        <p>Acceso al panel de mensajes.</p>
      </header>

      <form id="login-form" class="card" novalidate>
        <div class="field">
          <label for="username">Usuario</label>
          <input id="username" name="username" type="text" autocomplete="username" />
        </div>

        <div class="field">
          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" autocomplete="current-password" />
        </div>

        <button id="login-button" type="submit">Entrar</button>
        <p id="login-status" class="form-status form-status--error" role="alert"></p>
      </form>
    </main>

    <script type="module" src="/js/login.js"></script>
  </body>
</html>
